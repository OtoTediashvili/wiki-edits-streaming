[project]
name = "wiki-edits-streaming"
version = "0.1.0"
description = "Streaming pipeline: Wikimedia EventStreams -> Redpanda -> Spark -> Iceberg"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.16,<3",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.15,<3",
    "structlog>=26.1",
]

[project.scripts]
wikistream = "wikistream.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4",
    "pytest>=9.1",
    "pytest-cov>=7",
    "respx>=0.23",
    "ruff>=0.17",
]

[tool.uv]
# uv.lock was written by uv 0.11.32; older versions can't read it. CI and the
# Dockerfile pin 0.12.24.
required-version = ">=0.11.32"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikistream"]


# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TID", "PTH", "RUF"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=wikistream --cov-report=term-missing --cov-branch"
markers = [
    "integration: needs a running Redpanda (make up); run with make test-integration",
]
