[project]
name = "wiki-edits-streaming"
version = "0.1.0"
description = "Streaming pipeline: Wikimedia EventStreams -> Redpanda -> Spark -> Iceberg"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.16,<3",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.15,<3",
    "structlog>=26.1",
]

[project.scripts]
wikistream = "wikistream.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4",
    # A catalog in a SQLite file, and writes to day-partitioned tables: the
    # dashboard's tests read real Iceberg tables without SeaweedFS.
    "pyiceberg[pyiceberg-core,sql-sqlite]>=0.12,<0.13",
    "pytest>=9.1",
    "pytest-cov>=7",
    "respx>=0.23",
    "ruff>=0.17",
]
spark = [
    "pyspark==4.0.4",
]
dashboard = [
    "duckdb>=1.5.6,<2",
    "pyarrow>=20,<26",
    "pyiceberg[pyarrow]>=0.12,<0.13",
    "streamlit>=1.65,<2",
]

[tool.uv]
# uv.lock was written by uv 0.11.32; older versions can't read it. CI and the
# Dockerfiles pin 0.12.24.
required-version = ">=0.11.32"
# `uv sync` installs every group for development. The images pick what they
# need: the producer image takes no group, the Spark image only `spark`, the
# dashboard image only `dashboard`.
default-groups = ["dev", "spark", "dashboard"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikistream"]


# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TID", "PTH", "RUF"]

[tool.ruff.lint.pep8-naming]
# `functions as F`, `types as T`: PySpark's own import convention.
extend-ignore-names = ["F", "T"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
# PyArrow and pandas ship no type information (pandas' lives in a separate
# stubs package, too strict for the few frames handed to Streamlit here).
module = ["pyarrow", "pyarrow.*", "pandas", "pandas.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=wikistream --cov-report=term-missing --cov-branch"
markers = [
    "integration: needs a running Redpanda (make up); run with make test-integration",
    "spark: runs a local Spark (needs Java 17+); everything under tests/streaming",
    "e2e: the whole stack, Spark job included (make up); run with make test-e2e",
]
