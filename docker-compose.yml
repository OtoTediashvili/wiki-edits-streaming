# Local stack.
#   make up       Redpanda (Kafka API + schema registry), Redpanda Console,
#                 and SeaweedFS (S3 + Iceberg REST catalog)
#   make produce  the producer: live edits into Redpanda
#   make stream   the Spark job: Redpanda into Iceberg tables
#   make dashboard  the live dashboard on http://localhost:8501
#
# Every port is bound to 127.0.0.1: reachable from this machine, not from the
# network it's on.

name: wiki-edits-streaming

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.17
    command:
      - redpanda
      - start
      # Two listeners: containers use redpanda:9092, the host uses
      # localhost:19092. Each client is told the address it can reach.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      # Single node for a laptop: relaxed fsync and no CPU pinning, one core,
      # 1 GB. About 30 events a second needs a fraction of that.
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --default-log-level=warn
    ports:
      - "127.0.0.1:19092:19092"   # Kafka API
      - "127.0.0.1:18081:18081"   # schema registry
      - "127.0.0.1:19644:9644"    # admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    # Same policy as the services that need it: when Docker itself restarts,
    # the broker comes back too, not just the producer and the job.
    restart: unless-stopped

  console:
    image: docker.redpanda.com/redpandadata/console:v3.11.0
    # Console reads a config file; this writes it from the variable below.
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml && exec /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  producer:
    build: .
    image: wiki-edits-streaming-producer:dev
    # WIKISTREAM_CONTACT comes from .env (see .env.example). Optional here so
    # the other services and CI's image build work without one; `make produce`
    # checks it is set.
    env_file:
      - path: .env
        required: false
    environment:
      WIKISTREAM_BOOTSTRAP_SERVERS: redpanda:9092
      WIKISTREAM_SCHEMA_REGISTRY_URL: http://redpanda:8081
    volumes:
      # The resume position survives restarts and rebuilds.
      - producer-state:/state
    depends_on:
      redpanda:
        condition: service_healthy
    # Crashes restart it, and it resumes from the saved position. `docker
    # stop` sends SIGTERM, which the producer handles: confirm, save, exit.
    restart: unless-stopped
    stop_grace_period: 45s

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    # `mini` is SeaweedFS on one node: object storage with an S3 API, and an
    # Iceberg REST catalog on top of it. -tableBucket creates the warehouse
    # bucket on first start. WebDAV and the Lance catalog aren't needed. The
    # admin UI moves to 12646 because its default puts the admin gRPC port
    # (UI port + 10000) inside Linux's ephemeral range, where an outgoing
    # connection can take it first and fail the start.
    command:
      - mini
      - -dir=/data
      - -tableBucket=lake
      - -webdav=false
      - -s3.port.lance=0
      - -admin.port=12646
      - -master.telemetry=false
    environment:
      # The one identity, allowed everything. Local-stack values; the Spark
      # job and the tools on this machine use the same defaults.
      AWS_ACCESS_KEY_ID: ${WIKISTREAM_LAKE_ACCESS_KEY:-wikistream}
      AWS_SECRET_ACCESS_KEY: ${WIKISTREAM_LAKE_SECRET_KEY:-wikistream-local-secret}
    ports:
      - "127.0.0.1:8333:8333"     # S3
      - "127.0.0.1:8181:8181"     # Iceberg REST catalog
      - "127.0.0.1:12646:12646"   # admin UI: buckets, Iceberg tables
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8181/v1/config"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    # The job and the dashboard restart on their own; their storage has to too.
    restart: unless-stopped

  spark:
    build:
      context: .
      dockerfile: spark.Dockerfile
    image: wiki-edits-streaming-spark:dev
    command: ["run"]
    env_file:
      - path: .env
        required: false
    environment:
      WIKISTREAM_BOOTSTRAP_SERVERS: redpanda:9092
      WIKISTREAM_LAKE_CATALOG_URI: http://seaweedfs:8181
      WIKISTREAM_LAKE_S3_ENDPOINT: http://seaweedfs:8333
      # Same identity as the seaweedfs service above.
      WIKISTREAM_LAKE_ACCESS_KEY: ${WIKISTREAM_LAKE_ACCESS_KEY:-wikistream}
      WIKISTREAM_LAKE_SECRET_KEY: ${WIKISTREAM_LAKE_SECRET_KEY:-wikistream-local-secret}
      # The AWS SDK inside Iceberg otherwise adds checksums to every upload,
      # which not every S3-compatible store accepts. Only when required.
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
    ports:
      - "127.0.0.1:4040:4040"     # Spark UI: queries, batches, state
    volumes:
      # Offsets and state for each query. Kept with the tables: deleting one
      # without the other is what `make reset` is for.
      - spark-checkpoints:/checkpoints
    depends_on:
      redpanda:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    # On a failed query the job exits; the restart resumes from the
    # checkpoints. SIGTERM stops the queries cleanly.
    restart: unless-stopped
    stop_grace_period: 60s

  dashboard:
    build:
      context: .
      dockerfile: dashboard.Dockerfile
    image: wiki-edits-streaming-dashboard:dev
    env_file:
      - path: .env
        required: false
    environment:
      WIKISTREAM_LAKE_CATALOG_URI: http://seaweedfs:8181
      WIKISTREAM_LAKE_S3_ENDPOINT: http://seaweedfs:8333
      # Same identity as the seaweedfs service. The dashboard only reads.
      WIKISTREAM_LAKE_ACCESS_KEY: ${WIKISTREAM_LAKE_ACCESS_KEY:-wikistream}
      WIKISTREAM_LAKE_SECRET_KEY: ${WIKISTREAM_LAKE_SECRET_KEY:-wikistream-local-secret}
    ports:
      - "127.0.0.1:8501:8501"     # the dashboard
    depends_on:
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    # Without the lake (SeaweedFS down, no tables yet) the page says so and
    # keeps checking; it only exits if Streamlit itself fails.
    restart: unless-stopped

volumes:
  redpanda-data:
  producer-state:
  seaweedfs-data:
  spark-checkpoints:
