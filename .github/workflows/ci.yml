name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runners are pinned, not ubuntu-latest, so an image change is a commit here
# rather than a surprise. uv is pinned to the version in the Dockerfiles.
env:
  UV_VERSION: "0.12.24"
  GITLEAKS_VERSION: "8.23.3"

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # This job owns the uv cache; the others only restore it. Several jobs
      # saving the same key at once is what produced "Unable to reserve cache".
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # The Spark tests start a local Spark: Java 21, preinstalled on the
      # runner image, the same major version as the Spark image.
      - name: Use Java 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      # --locked: fail if uv.lock is out of date with pyproject.toml,
      # instead of quietly resolving something else than developers run.
      - name: Install from the lockfile
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest -m "not integration and not e2e" --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7
          if-no-files-found: ignore

  integration:
    name: Round trip through Redpanda
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false

      - name: Install from the lockfile
        run: uv sync --locked

      # The same docker-compose.yml as on a laptop, so CI tests the stack
      # people actually run. --wait blocks until the healthcheck passes.
      - name: Start Redpanda
        run: docker compose up -d --wait redpanda

      - name: Integration tests
        run: uv run pytest -m integration --no-cov

      - name: Redpanda logs
        if: failure()
        run: docker compose logs redpanda

      - name: Stop Redpanda
        if: always()
        run: docker compose down --volumes

  e2e:
    name: Recording through Spark into Iceberg
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          save-cache: false

      - name: Install from the lockfile
        run: uv sync --locked

      - name: Build the Spark image
        run: docker compose build spark

      - name: Start Redpanda and SeaweedFS
        run: docker compose up -d --wait redpanda seaweedfs

      # Produces the recording twice into a fresh topic, runs the job in the
      # Spark image (`docker compose run spark once`), reads Iceberg back,
      # and renders the dashboard over the result.
      - name: End-to-end test
        run: uv run pytest -m e2e --no-cov

      - name: Service logs
        if: failure()
        run: docker compose logs redpanda seaweedfs

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  image:
    name: Producer and dashboard images build and start
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker compose build producer dashboard

      # The entrypoint resolves and the package imports inside the image.
      - name: Smoke test the producer
        run: docker run --rm wiki-edits-streaming-producer:dev --help

      # Streamlit serves, and the app imports without Spark (the image has
      # none). No lake here: the page itself would say so and keep trying.
      - name: Smoke test the dashboard
        run: |
          docker run -d --name dashboard -p 127.0.0.1:8501:8501 wiki-edits-streaming-dashboard:dev
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8501/_stcore/health && exit 0
            sleep 1
          done
          docker logs dashboard
          exit 1

      - name: Dashboard logs
        if: failure()
        run: docker logs dashboard || true

  security:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history: a secret deleted later is still leaked

      # The gitleaks binary, not gitleaks-action: it scans the whole history
      # the same way locally and in CI, and survives force-pushes.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full git history
        run: gitleaks git . --redact --verbose --no-banner
